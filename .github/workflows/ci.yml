name: chronicle
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests scripts packages deploy
      - run: ruff format --check src tests scripts packages deploy
      - run: python scripts/check_fip_compatibility.py
      - run: python -m mypy src/chronicle packages/fip-contracts/src
      - run: pytest -q
      - run: python -m build
      - run: python -m build packages/fip-contracts
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements-dev.lock

